<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泽顺商品采集助手设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <div class="logo">泽</div>
      <div>
        <h1>泽顺商品采集助手设置</h1>
        <p>连接并登录武汉泽顺综合服务台</p>
      </div>
    </header>
    <section>
      <label for="console-url">控制台地址</label>
      <input id="console-url" type="url" placeholder="http://127.0.0.1:5000" autocomplete="url">
      <small>控制台和浏览器在同一台电脑时使用默认地址；连接其他电脑时填写控制台的内网地址。</small>

      <label for="username">泽顺控制台账号</label>
      <input id="username" type="text" placeholder="请输入账号" autocomplete="username">

      <label for="password">泽顺控制台密码</label>
      <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
      <small>账号密码仅用于本次登录且不会保存；登录后保存一个最长 6 小时的临时会话。</small>

      <div id="auth-status" class="auth-status">当前未登录</div>

      <label class="check-row">
        <input id="open-after" type="checkbox">
        <span>采集成功后自动打开泽顺控制台</span>
      </label>

      <div class="actions">
        <button id="login" class="primary" type="button">登录并测试</button>
        <button id="save" type="button">保存地址</button>
        <button id="logout" type="button">退出登录</button>
      </div>
      <div id="message" class="message" hidden></div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
