<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武汉泽顺综合服务台</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #172033;
            --muted: #667085;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --border: #d9e2ef;
            --log-bg: #101828;
            --log-text: #d1fadf;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }

        .topbar {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            color: #fff;
            padding: 26px 32px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.18);
        }

        .topbar h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .topbar p {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.82);
            font-size: 14px;
        }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 24px auto;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 24px rgba(16, 24, 40, 0.06);
        }

        .form-panel {
            padding: 22px;
        }

        .panel-title {
            margin: 0 0 18px;
            font-size: 18px;
            font-weight: 700;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font: inherit;
            outline: none;
            padding: 10px 12px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.55;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 10px 14px;
        }

        .primary {
            flex: 1;
            background: var(--primary);
            color: #fff;
        }

        .primary:hover {
            background: var(--primary-dark);
        }

        .secondary {
            background: #eef2f7;
            color: #344054;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .log-panel {
            display: flex;
            min-height: 650px;
            flex-direction: column;
            overflow: hidden;
        }

        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            padding: 16px 18px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: #98a2b3;
        }

        .status.running .status-dot {
            background: #22c55e;
            box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.14);
        }

        .status.error .status-dot {
            background: var(--danger);
            box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.12);
        }

        #log-container {
            flex: 1;
            margin: 0;
            background: var(--log-bg);
            color: var(--log-text);
            padding: 18px;
            overflow-y: auto;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 900px) {
            .page {
                grid-template-columns: 1fr;
            }

            .log-panel {
                min-height: 520px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>武汉泽顺综合服务台</h1>
        <p>选择 AI 客服或人工客服申诉，并实时查看本次任务日志</p>
    </header>

    <main class="page">
        <section class="panel form-panel">
            <h2 class="panel-title">任务参数</h2>

            <div class="field">
                <label for="name">店铺名</label>
                <input type="text" id="name" value="跃马扬鞭">
            </div>

            <div class="field">
                <label for="site">站点</label>
                <input type="text" id="site" value="墨西哥">
            </div>

            <div class="field">
                <label for="form">任务类型</label>
                <select id="form">
                    <option value="延误">延误</option>
                    <option value="侵权">侵权</option>
                    <option value="投诉">投诉</option>
                </select>
            </div>

            <div class="field">
                <label for="mode">客服模式</label>
                <select id="mode">
                    <option value="AI客服">找 AI 客服</option>
                    <option value="人工客服">人工客服申诉</option>
                </select>
            </div>

            <div class="field">
                <label for="message">自定义话术</label>
                <textarea id="message" placeholder="不填写时按脚本内置逻辑执行"></textarea>
            </div>

            <div class="actions">
                <button class="primary" id="start-btn" onclick="startTask()">开始执行</button>
                <button class="secondary" type="button" onclick="clearLog()">清空日志</button>
            </div>
        </section>

        <section class="panel log-panel">
            <div class="log-header">
                <h2 class="panel-title" style="margin: 0;">实时运行日志</h2>
                <span class="status" id="status">
                    <span class="status-dot"></span>
                    <span id="status-text">等待任务启动</span>
                </span>
            </div>
            <pre id="log-container">等待任务启动...</pre>
        </section>
    </main>

    <script>
        const logContainer = document.getElementById("log-container");
        const startBtn = document.getElementById("start-btn");
        const statusBox = document.getElementById("status");
        const statusText = document.getElementById("status-text");

        function setStatus(text, state) {
            statusText.textContent = text;
            statusBox.className = `status ${state || ""}`.trim();
        }

        function appendLog(text) {
            logContainer.textContent += text;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLog() {
            logContainer.textContent = "";
            setStatus("等待任务启动", "");
        }

        async function startTask() {
            startBtn.disabled = true;
            logContainer.textContent = "";
            setStatus("任务运行中", "running");
            appendLog("正在建立连接...\n");

            const params = new URLSearchParams({
                name: document.getElementById("name").value,
                site: document.getElementById("site").value,
                form: document.getElementById("form").value,
                mode: document.getElementById("mode").value,
                message: document.getElementById("message").value
            });

            try {
                const response = await fetch(`/api/run_shensu?${params.toString()}`);
                if (!response.ok || !response.body) {
                    throw new Error(`接口请求失败：${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    appendLog(decoder.decode(value, { stream: true }));
                }

                appendLog("\n>>> [任务结束]\n");
                setStatus("任务已结束", "");
            } catch (err) {
                appendLog(`\n连接或执行出错：${err.message || err}\n`);
                setStatus("任务异常", "error");
            } finally {
                startBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
