<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>员工任务 · 泽顺工作台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='employee-tasks.css') }}">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f3f6fb;color:#172033}.shell{max-width:1200px;margin:auto;padding:28px 24px 60px}.top,.heading,.task-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin:0 0 16px}.subtitle{color:#64748b;font-size:14px}.top{margin-bottom:24px}.panel,.task{background:white;border:1px solid #e4e9f0;border-radius:14px;padding:20px;margin-bottom:18px}.task{margin-bottom:0;border-left:4px solid #84adff}.task.overdue{border-left-color:#d92d20}.task.resolved{border-left-color:#12b76a}.button{font:inherit;border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 13px;color:#344054;cursor:pointer;text-decoration:none}.button.primary{background:#175cd3;color:white;border-color:#175cd3}.button:disabled{opacity:.5;cursor:default}.task-title{font-size:16px;font-weight:700}.task-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:12px;background:#f2f4f7;color:#475467;padding:4px 8px;border-radius:20px}.empty{padding:28px;text-align:center;color:#64748b}.hint{font-size:13px;color:#64748b}[hidden]{display:none!important}@media(max-width:600px){.shell{padding:18px 12px}.panel{padding:14px}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><h1>员工任务</h1><div class="subtitle">设置工作安排，查看业务员的完成情况和备注。时间统一为北京时间。</div></div><div><a class="button" href="/">返回工作台</a> <a class="button" href="/mercado/today">今日必办</a></div></header>
<section class="panel">
<h2 id="employee-form-title">新增任务</h2>
<form id="employee-form" class="employee-form">
<label class="employee-wide">任务标题<input name="title" required maxlength="200" placeholder="请输入任务标题"></label>
<label class="employee-wide">任务内容<textarea name="content" required maxlength="10000" placeholder="说明工作内容和完成要求"></textarea></label>
<label>开始时间（北京时间）<input type="datetime-local" name="starts_at" required></label>
<label>截止时间（北京时间）<input type="datetime-local" name="due_at" required></label>
<label class="employee-wide">指定完成业务员<select name="assignee_id" required><option value="">正在加载企业员工…</option></select></label>
<div class="employee-wide"><button class="button primary" id="employee-submit" type="submit" disabled>创建任务</button> <button class="button" id="employee-cancel" type="button" hidden>取消编辑</button><span id="employee-form-message" role="status"></span></div>
</form>
</section>
{% include '_employee_tasks_panel.html' %}
</main>
<script src="{{ url_for('static', filename='employee-tasks.js') }}" defer></script>
</body></html>
