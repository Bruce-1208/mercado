<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建账号 - 武汉泽顺综合服务台</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/zeshun-monogram-gold.png') }}">
    <style>
        :root {
            --bg: #070d1c;
            --panel: #fff;
            --text: #172033;
            --muted: #667085;
            --primary: #b88a42;
            --primary-dark: #936a2e;
            --border: #dfe4ec;
            --gold: #e0bd78;
            --danger: #dc2626;
            --success: #067647;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 0;
            background:
                radial-gradient(circle at 50% 12%, rgba(46, 70, 115, .52), transparent 34%),
                linear-gradient(145deg, rgba(5, 10, 23, .98), rgba(12, 24, 49, .94)),
                var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }
        .panel {
            width: min(560px, calc(100vw - 28px));
            overflow: hidden;
            border: 1px solid rgba(224, 189, 120, .32);
            border-radius: 14px;
            background: var(--panel);
            box-shadow: 0 26px 70px rgba(0, 0, 0, .42);
        }
        .header {
            position: relative;
            padding: 20px 24px 18px;
            background:
                radial-gradient(circle at 18% 15%, rgba(69, 92, 139, .38), transparent 36%),
                linear-gradient(145deg, #060c1b, #111d36);
            color: #fff;
        }
        .header::after {
            position: absolute;
            right: 22px;
            bottom: 0;
            left: 22px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            content: "";
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo { width: 56px; height: 56px; object-fit: contain; }
        h1 { margin: 0; color: #f0d59c; font-size: 22px; letter-spacing: .1em; }
        .company { margin: 4px 0 0; color: rgba(255,255,255,.72); font-size: 11px; }
        .subtitle { margin: 14px 0 0; color: rgba(255,255,255,.76); font-size: 12px; }
        form { padding: 20px 24px 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
        .field { min-width: 0; margin-bottom: 13px; }
        .wide { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
        input {
            width: 100%;
            min-height: 38px;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font: inherit;
            outline: none;
            padding: 8px 10px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(184,138,66,.14); }
        .code-row { display: grid; grid-template-columns: 1fr 145px; gap: 9px; }
        button {
            min-height: 40px;
            border: 0;
            border-radius: 7px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            padding: 9px 12px;
        }
        button:hover { background: var(--primary-dark); }
        button:disabled { cursor: not-allowed; opacity: .68; }
        .submit { width: 100%; margin-top: 2px; }
        .message {
            display: none;
            margin: 0 0 14px;
            border: 1px solid #fecaca;
            border-radius: 7px;
            background: #fef2f2;
            color: var(--danger);
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 700;
        }
        .message.success { border-color: #abefc6; background: #ecfdf3; color: var(--success); }
        .foot { padding: 0 24px 18px; color: var(--muted); font-size: 12px; text-align: center; }
        .foot a { color: var(--primary-dark); font-weight: 700; text-decoration: none; }
        .security { margin: 11px 0 0; font-size: 11px; line-height: 1.5; }
        @media (max-width: 520px) {
            .grid { grid-template-columns: 1fr; }
            .wide { grid-column: auto; }
            form { padding: 18px; }
            .header { padding-right: 18px; padding-left: 18px; }
            .foot { padding-right: 18px; padding-left: 18px; }
        }
    </style>
</head>
<body>
    <section class="panel">
        <header class="header">
            <div class="brand">
                <img class="logo" src="{{ url_for('static', filename='images/zeshun-monogram-gold.png') }}" alt="武汉泽顺 Logo">
                <div>
                    <h1>创建工作台账号</h1>
                    <p class="company">武汉·泽顺商贸有限公司</p>
                </div>
            </div>
            <p class="subtitle">填写资料并验证邮箱，提交成员账号申请</p>
        </header>
        <form id="register-form" autocomplete="on">
            <p class="message" id="form-message" role="status"></p>
            <div class="grid">
                <div class="field">
                    <label for="username">登录账号</label>
                    <input id="username" name="username" minlength="3" maxlength="64" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="display-name">姓名</label>
                    <input id="display-name" name="display_name" maxlength="64" autocomplete="name" required>
                </div>
                <div class="field wide">
                    <label for="email">邮箱</label>
                    <input id="email" name="email" type="email" maxlength="128" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="wechat-id">微信号</label>
                    <input id="wechat-id" name="wechat_id" maxlength="64" autocomplete="off" required>
                </div>
                <div class="field">
                    <label for="phone">手机号</label>
                    <input id="phone" name="phone" type="tel" maxlength="32" autocomplete="tel" required>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="password-confirm">确认密码</label>
                    <input id="password-confirm" name="password_confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                </div>
                <div class="field wide">
                    <label for="verification-code">邮箱验证码</label>
                    <div class="code-row">
                        <input id="verification-code" name="verification_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
                        <button id="send-code" type="button">获取验证码</button>
                    </div>
                </div>
            </div>
            <button class="submit" id="register-button" type="submit">创建账号</button>
            <p class="security">默认公司为武汉泽顺，角色为成员，仅可查看和操作本人数据、调用本人绑定的本地 Agent。验证码 10 分钟有效；密码至少 8 位。账号需管理员审核启用后才能登录。</p>
        </form>
        <div class="foot">已有账号？<a href="/login">返回登录</a></div>
    </section>
    <script>
        const form = document.getElementById("register-form");
        const message = document.getElementById("form-message");
        const sendButton = document.getElementById("send-code");
        const submitButton = document.getElementById("register-button");
        const emailInput = document.getElementById("email");
        let countdownTimer = null;

        function showMessage(text, success = false) {
            message.textContent = text;
            message.classList.toggle("success", success);
            message.style.display = "block";
        }

        async function postJson(url, data) {
            const response = await fetch(url, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data),
            });
            const payload = await response.json();
            if (!response.ok || payload.status !== "success") {
                throw new Error(payload.message || "请求失败，请稍后再试");
            }
            return payload;
        }

        sendButton.addEventListener("click", async () => {
            message.style.display = "none";
            if (!emailInput.reportValidity()) return;
            sendButton.disabled = true;
            sendButton.textContent = "发送中…";
            try {
                const result = await postJson("/api/registration/send-code", {email: emailInput.value.trim()});
                showMessage(result.message || "请查看邮箱中的验证码", true);
                let seconds = 60;
                sendButton.textContent = `${seconds} 秒后重试`;
                countdownTimer = window.setInterval(() => {
                    seconds -= 1;
                    if (seconds <= 0) {
                        window.clearInterval(countdownTimer);
                        sendButton.disabled = false;
                        sendButton.textContent = "重新获取验证码";
                    } else {
                        sendButton.textContent = `${seconds} 秒后重试`;
                    }
                }, 1000);
            } catch (error) {
                showMessage(error.message || "验证码发送失败");
                sendButton.disabled = false;
                sendButton.textContent = "获取验证码";
            }
        });

        form.addEventListener("submit", async event => {
            event.preventDefault();
            message.style.display = "none";
            const password = document.getElementById("password").value;
            const confirmation = document.getElementById("password-confirm").value;
            if (password !== confirmation) {
                showMessage("两次输入的密码不一致");
                document.getElementById("password-confirm").focus();
                return;
            }
            submitButton.disabled = true;
            submitButton.textContent = "正在创建账号…";
            let registrationSubmitted = false;
            try {
                const result = await postJson("/api/register", {
                    username: document.getElementById("username").value.trim(),
                    display_name: document.getElementById("display-name").value.trim(),
                    email: emailInput.value.trim(),
                    wechat_id: document.getElementById("wechat-id").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    password,
                    verification_code: document.getElementById("verification-code").value.trim(),
                });
                showMessage(result.message || "注册申请已提交，管理员审核启用后即可登录", true);
                for (const control of form.elements) control.disabled = true;
                submitButton.textContent = "申请已提交";
                registrationSubmitted = true;
            } catch (error) {
                showMessage(error.message || "注册失败");
            } finally {
                if (!registrationSubmitted) {
                    submitButton.disabled = false;
                    submitButton.textContent = "创建账号";
                }
            }
        });
    </script>
</body>
</html>
