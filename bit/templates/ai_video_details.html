<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>视频上传明细</title>
<style>body{font:14px system-ui;margin:32px;background:#f5f7fb;color:#17263c}main{max-width:1400px;margin:auto}a{color:#245bc4}table{border-collapse:collapse;width:100%;background:white}td,th{padding:14px;text-align:left;border-bottom:1px solid #e2e7ef}th{white-space:nowrap}video{max-height:320px;max-width:100%;margin:20px 0}.table{overflow:auto}#message{padding:18px 0}small{display:block;color:#68758a;max-width:300px;overflow-wrap:anywhere}</style><link rel="stylesheet" href="{{ url_for('static', filename='zeshun-theme.css') }}?v=20260930-unified1">
</head>
<body class="zs-standalone"><main><a href="javascript:history.back()">← 返回视频列表</a><h1>视频上传明细</h1><p id="meta"></p><video id="preview" controls hidden></video><div id="message">正在读取上传记录…</div><div class="table"><table><thead><tr><th>美客多编号</th><th>业务员（上传人）</th><th>店铺名</th><th>店铺编号 / 站点</th><th>上传时间</th><th>审核状态</th><th>最近同步</th></tr></thead><tbody id="records"></tbody></table></div></main>
<script>
const jobId = {{ job_id|tojson }};
const labels={UNDER_REVIEW:'已提交待审核',PUBLISHED:'视频审核通过',REJECTED:'视频审核不通过',TRANSCODING_REJECTED:'视频审核不通过（转码失败）',PAUSED:'已暂停'};
function cell(tr,text){const td=document.createElement('td');td.textContent=text || '—';tr.append(td);return td;}
function date(value){return value ? new Date(value).toLocaleString('zh-CN') : '—';}
async function load(){try{const response=await fetch(`/api/ai-videos/jobs/${encodeURIComponent(jobId)}`);const payload=await response.json();if(!response.ok)throw Error(payload.message||'读取失败');const job=payload.data;document.getElementById('meta').textContent=job.target?.title || job.id;const video=document.getElementById('preview');if(job.content_url){video.src=job.content_url;video.hidden=false;}const rows=job.published || [];document.getElementById('message').textContent=rows.length ? `共 ${rows.length} 条上传记录；待审核记录每天自动同步。` : '此视频暂无上传记录';const body=document.getElementById('records');body.replaceChildren();for(const row of [...rows].reverse()){const tr=document.createElement('tr');const td=cell(tr,row.item_id);try{const url=new URL(row.permalink);if(['https:','http:'].includes(url.protocol)){const a=document.createElement('a');a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=row.item_id;td.replaceChildren(a);}}catch{}cell(tr,row.salesperson||'历史记录未记录');cell(tr,row.store_name);cell(tr,`${row.token_id||'—'} / ${row.site_id||'—'}`);cell(tr,date(row.uploaded_at||row.published_at));const status=cell(tr,row.status_label||labels[row.status]||'已提交待审核');if(row.error){const small=document.createElement('small');small.textContent=row.error;status.append(small);}cell(tr,date(row.checked_at));body.append(tr);}}catch(error){document.getElementById('message').textContent=error.message;}}
load();
</script></body></html>
