<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>视频上传明细</title>
    <style>
        body{font:14px system-ui;margin:32px;background:#f5f7fb;color:#17263c}main{max-width:1400px;margin:auto}a{color:#245bc4}video{max-height:320px;max-width:100%;margin:20px 0}
        .ai-video-library-head,.ai-video-pagination,.ai-video-pagination-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.ai-video-filter-bar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:20px 0}.ai-video-filter-bar label{display:grid;gap:6px;max-width:220px}.ai-video-pagination{margin-top:16px}.market-metric-note{color:#68758a}.panel{padding:20px;background:white;border-radius:12px}@media(max-width:640px){body{margin:12px}.panel{padding:14px}.ai-video-pagination{flex-wrap:wrap}}
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='zeshun-theme.css') }}?v=20261010-clean">
    <link rel="stylesheet" href="{{ url_for('static', filename='video-upload-logs.css') }}?v=20261011-audit">
    <script defer src="{{ url_for('static', filename='date-filter-display.js') }}?v=20261007"></script>
    <script defer src="{{ url_for('static', filename='workbench-ui.js') }}?v=20261007-date-filters"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='erp-density.css') }}?v=20261011-compact">
</head>
<body class="zs-standalone"><main>
    <a href="/?tab=ai-video">← 返回视频列表</a><h1>视频上传明细</h1><p id="meta"></p><video id="preview" controls hidden></video>
    {% include 'video_upload_logs_panel.html' %}
</main>
<script>
const jobId = {{ job_id|tojson }};
async function loadPreview(){
    try{
        const response=await fetch(`/api/ai-videos/jobs/${encodeURIComponent(jobId)}`);
        const payload=await response.json();
        if(!response.ok || payload.status !== 'success') throw Error(payload.message||'读取视频失败');
        const job=payload.data;
        document.getElementById('meta').textContent=(job.name || job.target?.title || job.id) + " · 生成：" + ({succeeded:"完成",failed:"失败",generating:"进行中"}[job.status] || job.status || "未知") + " → 上传：见下方逐条记录 → 发布：以平台审核结果为准";
        if(job.content_url){const video=document.getElementById('preview');video.src=job.content_url;video.hidden=false;}
    }catch(error){document.getElementById('meta').textContent=error.message;}
}
loadPreview();
</script>
<script src="{{ url_for('static', filename='video-upload-logs.js') }}?v=20261011-audit"></script>
</body></html>
