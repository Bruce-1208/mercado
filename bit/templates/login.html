<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 武汉泽顺综合服务台</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/zeshun-monogram-gold.png') }}">
    <style>
        :root {
            --bg: #070d1c;
            --panel: #ffffff;
            --text: #172033;
            --muted: #667085;
            --primary: #b88a42;
            --primary-dark: #936a2e;
            --border: #dfe4ec;
            --navy: #081126;
            --gold: #e0bd78;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 12%, rgba(46, 70, 115, .52), transparent 34%),
                linear-gradient(145deg, rgba(5, 10, 23, .98), rgba(12, 24, 49, .94)),
                var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }

        .login-panel {
            width: min(420px, calc(100vw - 32px));
            border: 1px solid rgba(224, 189, 120, .32);
            border-radius: 14px;
            background: var(--panel);
            box-shadow: 0 26px 70px rgba(0, 0, 0, .42);
            overflow: hidden;
        }

        .login-header {
            position: relative;
            background:
                radial-gradient(circle at 18% 15%, rgba(69, 92, 139, .38), transparent 36%),
                linear-gradient(145deg, #060c1b, #111d36);
            color: #fff;
            padding: 22px 22px 19px;
        }

        .login-header::after {
            position: absolute;
            right: 22px;
            bottom: 0;
            left: 22px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            content: "";
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .login-logo {
            width: 66px;
            height: 66px;
            flex: 0 0 66px;
            object-fit: contain;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .28));
        }

        .login-brand-copy {
            min-width: 0;
        }

        h1 {
            margin: 0;
            color: #f0d59c;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: .13em;
        }

        .company-name {
            margin: 5px 0 0;
            color: rgba(255, 255, 255, .72);
            font-size: 11px;
            letter-spacing: .06em;
        }

        .company-name-en {
            display: block;
            margin-top: 2px;
            color: rgba(224, 189, 120, .7);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 10px;
            letter-spacing: .04em;
        }

        .login-subtitle {
            margin: 15px 0 0;
            color: rgba(255, 255, 255, .76);
            font-size: 12px;
        }

        form {
            padding: 20px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font: inherit;
            outline: none;
            padding: 9px 10px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(184, 138, 66, .14);
        }

        .remember-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin: 2px 0 16px;
        }

        .remember-option {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 0;
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .remember-option input {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            margin: 1px 0 0;
            accent-color: var(--primary);
        }

        .remember-copy {
            display: grid;
            gap: 2px;
        }

        .remember-copy small {
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
        }

        .security-note {
            margin: 13px 0 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.55;
            text-align: center;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 7px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            padding: 10px 12px;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.68;
        }

        .error {
            display: none;
            margin: 0 0 14px;
            border: 1px solid #fecaca;
            border-radius: 7px;
            background: #fef2f2;
            color: var(--danger);
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <section class="login-panel">
        <div class="login-header">
            <div class="login-brand">
                <img class="login-logo" src="{{ url_for('static', filename='images/zeshun-monogram-gold.png') }}" alt="武汉泽顺 Logo">
                <div class="login-brand-copy">
                    <h1>武汉泽顺</h1>
                    <p class="company-name">武汉·泽顺商贸有限公司</p>
                    <small class="company-name-en">Wuhan Zeshun Trading Co., Ltd.</small>
                </div>
            </div>
            <p class="login-subtitle">综合运营服务台 · 请输入账号密码后继续</p>
        </div>
        <form id="login-form" action="/api/login" method="post" autocomplete="on">
            <p class="error" id="error-box"></p>
            <div class="field">
                <label for="username">账号</label>
                <input id="username" name="username" autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password">
            </div>
            <div class="remember-row">
                <label class="remember-option" for="remember-login">
                    <input id="remember-login" name="remember" type="checkbox" value="1">
                    <span class="remember-copy">记住账号密码<small>6 小时内自动登录</small></span>
                </label>
            </div>
            <button id="login-btn" type="submit">登录</button>
            <p class="security-note">密码不会以明文保存在页面中，登录状态由安全 Cookie 维持。</p>
        </form>
    </section>

    <script>
        const form = document.getElementById("login-form");
        const button = document.getElementById("login-btn");
        const errorBox = document.getElementById("error-box");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const rememberLogin = document.getElementById("remember-login");
        const rememberedUsernameKey = "zeshun-remembered-username";

        const rememberedUsername = window.localStorage.getItem(rememberedUsernameKey) || "";
        if (rememberedUsername) {
            usernameInput.value = rememberedUsername;
            rememberLogin.checked = true;
            passwordInput.focus();
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = "block";
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            errorBox.style.display = "none";
            button.disabled = true;
            button.textContent = "登录中...";

            try {
                const username = usernameInput.value.trim();
                const remember = rememberLogin.checked;
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username,
                        password: passwordInput.value,
                        remember,
                    })
                });
                const payload = await response.json();
                if (!response.ok || payload.status !== "success") {
                    throw new Error(payload.message || "登录失败");
                }
                if (remember) {
                    window.localStorage.setItem(rememberedUsernameKey, username);
                } else {
                    window.localStorage.removeItem(rememberedUsernameKey);
                }
                const params = new URLSearchParams(window.location.search);
                window.location.href = params.get("next") || "/";
            } catch (error) {
                showError(error.message || "登录失败");
            } finally {
                button.disabled = false;
                button.textContent = "登录";
            }
        });
    </script>
</body>
</html>
