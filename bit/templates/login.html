<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 武汉泽顺综合服务台</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #172033;
            --muted: #667085;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --border: #d9e2ef;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }

        .login-panel {
            width: min(420px, calc(100vw - 32px));
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 18px 42px rgba(16, 24, 40, 0.12);
            overflow: hidden;
        }

        .login-header {
            background: #2563eb;
            color: #fff;
            padding: 18px 20px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .login-header p {
            margin: 5px 0 0;
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
        }

        form {
            padding: 20px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font: inherit;
            outline: none;
            padding: 9px 10px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .remember-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin: 2px 0 16px;
        }

        .remember-option {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 0;
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .remember-option input {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            margin: 1px 0 0;
            accent-color: var(--primary);
        }

        .remember-copy {
            display: grid;
            gap: 2px;
        }

        .remember-copy small {
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
        }

        .security-note {
            margin: 13px 0 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.55;
            text-align: center;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 7px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            padding: 10px 12px;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.68;
        }

        .error {
            display: none;
            margin: 0 0 14px;
            border: 1px solid #fecaca;
            border-radius: 7px;
            background: #fef2f2;
            color: var(--danger);
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <section class="login-panel">
        <div class="login-header">
            <h1>武汉泽顺综合服务台</h1>
            <p>请输入账号密码后继续</p>
        </div>
        <form id="login-form" action="/api/login" method="post" autocomplete="on">
            <p class="error" id="error-box"></p>
            <div class="field">
                <label for="username">账号</label>
                <input id="username" name="username" autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password">
            </div>
            <div class="remember-row">
                <label class="remember-option" for="remember-login">
                    <input id="remember-login" name="remember" type="checkbox" value="1">
                    <span class="remember-copy">记住账号密码<small>6 小时内自动登录</small></span>
                </label>
            </div>
            <button id="login-btn" type="submit">登录</button>
            <p class="security-note">密码不会以明文保存在页面中，登录状态由安全 Cookie 维持。</p>
        </form>
    </section>

    <script>
        const form = document.getElementById("login-form");
        const button = document.getElementById("login-btn");
        const errorBox = document.getElementById("error-box");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const rememberLogin = document.getElementById("remember-login");
        const rememberedUsernameKey = "zeshun-remembered-username";

        const rememberedUsername = window.localStorage.getItem(rememberedUsernameKey) || "";
        if (rememberedUsername) {
            usernameInput.value = rememberedUsername;
            rememberLogin.checked = true;
            passwordInput.focus();
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = "block";
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            errorBox.style.display = "none";
            button.disabled = true;
            button.textContent = "登录中...";

            try {
                const username = usernameInput.value.trim();
                const remember = rememberLogin.checked;
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username,
                        password: passwordInput.value,
                        remember,
                    })
                });
                const payload = await response.json();
                if (!response.ok || payload.status !== "success") {
                    throw new Error(payload.message || "登录失败");
                }
                if (remember) {
                    window.localStorage.setItem(rememberedUsernameKey, username);
                } else {
                    window.localStorage.removeItem(rememberedUsernameKey);
                }
                const params = new URLSearchParams(window.location.search);
                window.location.href = params.get("next") || "/";
            } catch (error) {
                showError(error.message || "登录失败");
            } finally {
                button.disabled = false;
                button.textContent = "登录";
            }
        });
    </script>
</body>
</html>
